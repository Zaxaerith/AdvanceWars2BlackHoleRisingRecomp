# --- AgbMain main-loop interior labels ---------------------------------------
# AgbMain @ 0x08036D1C (aw2bhr). The spin loop at 0x08036DFE..0x08036E0C is
# `while (1) { call_via_r0(); sub_08036E18(); }` — a guest infinite loop of BLs.
# If 0x08036DFE / 0x08036E08 are separate dispatch roots the `b` between them
# becomes mutual C++ recursion (STATUS_STACK_OVERFLOW ~frame 334). Mark them as
