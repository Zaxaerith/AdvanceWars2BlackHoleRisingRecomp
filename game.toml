# ---------------------------------------------------------------------------
# Advance Wars 2: Black Hole Rising (GBA, USA "AW2E") — gbarecomp game config.
#
# One file serves both pipeline sides (docs/TOML_SCHEMA.md):
#   * recompiler  -> [program], [identity], discovery metadata
#   * runtime     -> [rom], [bios], [save], [video], [audio], [runtime]
#
# Provenance: identity values were measured from the verified local ROM
# (see baserom.md). Nothing here is copied from another game's address table.
#
# HUMAN-REVIEWED ONLY: never auto-merge recomp_master_misses_*.toml.frag
# proposals into this file.
# ---------------------------------------------------------------------------

[game]
name = "Advance Wars 2: Black Hole Rising"
short_name = "aw2bhr"

[program]
name = "Advance Wars 2: Black Hole Rising"
id = "AW2E"
load_address = 0x08000000
size = 0x00800000
entry_pc = 0x080000C0          # cartridge reset: ARM branch at 0x00 (0xEA00002E)
codegen_shards = 8
# OFF: PC-relative literal harvest was shredding AgbMain / sub_080368E8 into
# 4-byte micro-functions (every interior label became a dispatch root). The
# guest `b` main-loop then compiled to mutual runtime_dispatch recursion and
# overflowed the host stack at ~frame 334. Keep harvest off until the finder
# only accepts compiler-shaped function prologues.
speculative_literal_harvest = false
# OFF: every-instruction resume switches made static bodies huge and runs
# ~90 ms/frame even on a FULLY_STATIC BIOS intro. Interior labels that need
# resume are declared explicitly with [[extra_func]] resume = true.
static_resume_all = false

[identity]
sha1 = "14dd0b22c894865867aff89e8116b2dffae25605"
md5 = "46599031ef71117c587bd3666c326c07"

[rom]
path = "Advance Wars 2 - Black Hole Rising (USA).gba"
sha1 = "14dd0b22c894865867aff89e8116b2dffae25605"

[bios]
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"
# LLE default: execute the recompiled BIOS through the dispatch table.
hle = false
skip_intro = false

[save]
# Evidence: ROM file offset 0x485480 holds ASCII "FLASH_V126" (bare FLASH_V).
# Framework detector maps bare FLASH_V -> Flash512. Full save/load cycle is
# still untested; if the driver probes a 1 Mbit chip, switch to flash1m/131072.
type = "flash512"
size = 65536
path = "saves/aw2bhr_usa.sav"

[runtime]
window_title = "AdvanceWars2BlackHoleRisingRecomp"

[video]
screen = "raw"
view_width = 240
resize_view = false

[audio]
shadow = false

# ---------------------------------------------------------------------------
# Discovery metadata — reviewed merge of logs/run300-misses.toml.frag
# (300-frame headless boot, 2026-10-01). HUMAN-REVIEWED; never auto-merge.
#
# Source evidence from third_party/aw2bhr @ 63a2694 (local-only, no LICENSE):
#   * src/crt0.s: IrqMain @ 0x080000FC, interior return label 0x080001F8
#   * asm/*: thumb_func_start sub_08067564 / sub_08067690 / sub_080688C8 /
#            sub_08068BE4 / sub_0806FB6C / sub_0806FB84
# Rejected (not declared on purpose):
#   * 0x03000FB0 — aw2bhr.lds marks gUnknown_03000FB0 as IWRAM DATA
#     (after libgcc dp-bit/fp-bit .bss), not a code_copy. Dynamic/code-or-data
#     confusion; leave to interpreter until a real writer is identified.
#   * 0x03007C90..0x03007D80 — high IWRAM next to the system stack
#     (crt0 sp=0x03007E00). Same family as WarioLand4 F6 stack-stubs; declaring
#     them as static functions caused wild jumps there. Leave interpreted.
# ---------------------------------------------------------------------------

# ARM IRQ dispatcher, reached through the user IRQ vector at 0x03007FFC
# (crt0 stores IrqMain there). Nothing calls it statically.
[[extra_func]]
addr = 0x080000FC
mode = "arm"
name = "IrqMain"
note = "crt0.s IrqMain; installed as user IRQ vector 0x03007FFC"

# Interior labels of IrqMain MUST be resume aliases, not roots — a root makes
# every `b`/`bx lr` a runtime_dispatch call and the IRQ path nests 1024-deep
# (generated call-return stack overflow at 0x0806FE24).
[[extra_func]]
addr = 0x08000120
mode = "arm"
resume = true
note = "IrqMain spin-wait interior (`bne _08000120`); NOT a root"

